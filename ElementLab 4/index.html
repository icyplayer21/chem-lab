ment.",visuals:[Ce("ammonium","Ammonium","Polyatomic cation · charge +1"),Ce("sulfate","Sulfate","Polyatomic anion · charge −2")]},{title:"One ion can contain many atoms",text:"Ammonium contains one nitrogen and four hydrogen atoms, but remains one ion. Sulfate contains one sulfur and four oxygen atoms. Neither is a neutral molecule. Keep the group together when it occurs in a salt. Many familiar polyatomic ions are negative, but ammonium is an important positive example.",visuals:[{label:"Atom count",body:"NH4",caption:"N: 1 · H: 4 · 5 atoms in one ion"},{label:"Charge of the group",body:"NH4",charge:1,caption:"The superscript + means +1, not +4."}]}],examples:[{id:"read-ammonium",title:"Read ammonium from the inside out",prompt:"How do the subscript and superscript in ammonium describe different things?",steps:[{title:"Identify the symbols",text:"N is nitrogen and H is hydrogen. No subscript after N means one nitrogen atom.",visuals:[{label:"Nitrogen and hydrogen",body:"NH4"}]},{title:"Read the subscript",text:"The 4 belongs to H, so this ion has four hydrogen atoms. It does not mean four ions."},{title:"Read the superscript",text:"A bare plus sign means a net charge of +1 on the complete group. It therefore belongs to the cation class.",visuals:[Ce("ammonium","One positively charged group")]}],answer:"Ammonium is a polyatomic cation with one nitrogen atom, four hydrogen atoms and charge +1.",answerVisual:Ce("ammonium","Ammonium")}],checks:[{id:"ion-sign-classification",kind:"choice",prompt:"Which statement correctly classifies sulfate?",options:[{id:"anion",label:"A polyatomic anion with charge −2",visual:Ce("sulfate","Sulfate")},{id:"cation",label:"A polyatomic cation with charge +2"},{id:"oxygen-charge",label:"Four separate ions, each carrying the displayed charge"}],correct:"anion",explanation:"The 2− superscript is the net charge of one sulfate ion. The O subscript 4 counts oxygen atoms inside that ion."},{id:"ion-charge-match",kind:"match",prompt:"Match each ion to its charge class.",pairs:[{id:"ammonium-cation",left:"Ammonium",leftVisual:Ce("ammonium","Ammonium"),right:"Polyatomic cation · +1"},{id:"sulfate-anion",left:"Sulfate",leftVisual:Ce("sulfate","Sulfate"),right:"Polyatomic anion · −2"}],explanation:"Both groups have several atoms. Their opposite charge signs determine whether they are cations or anions."}],summary:["Subscripts count atoms; superscripts give the charge of the whole ion.","Positive ions are cations, negative ions are anions.","Ammonium is a positive polyatomic ion; sulfate is negative."],sources:[yc,v0]},{id:"ion-ate-ite",stage:"ions",title:"The -ate and -ite Pattern",zh:"-ate 与 -ite 的相对规律",intro:"Related oxyanions can offer a useful memory connection. First learn each complete name, formula and charge, then compare members of the same family.",objectives:["Compare nitrate with nitrite and sulfate with sulfite.","Keep oxygen counts separate from charges.","Explain why a relative pattern cannot determine an unfamiliar formula."],sections:[{title:"Compare like with like",text:"Nitrate and nitrite have the same central element and the same −1 charge. Nitrate has three oxygens; nitrite has two. Sulfate and sulfite both have charge −2, with four and three oxygens respectively. Within each of these pairs, the -ate member has one more oxygen than the -ite member.",visuals:[Ce("nitrate","Nitrate","3 oxygen atoms · −1"),Ce("nitrite","Nitrite","2 oxygen atoms · −1"),Ce("sulfate","Sulfate","4 oxygen atoms · −2"),Ce("sulfite","Sulfite","3 oxygen atoms · −2")]},{title:"A relationship, not a formula generator",text:"The ending compares corresponding ions; it does not set an absolute oxygen count. Nitrate has three oxygens while sulfate has four. Nor does the ending independently determine charge. Learn the verified formula and charge of each family before using the comparison as a memory aid.",visuals:[Ce("nitrate","Not every -ate has four oxygens"),Ce("sulfate","Not every -ate has charge −1")]}],examples:[{id:"sulfate-sulfite-comparison",title:"Compare sulfate and sulfite carefully",prompt:"What stays the same, and what changes, when comparing sulfate with sulfite?",steps:[{title:"Find the common central atom",text:"Both formulas contain one sulfur atom. Compare these two related ions, rather than comparing unrelated -ate ions."},{title:"Count oxygen atoms",text:"Sulfate contains four oxygen atoms; sulfite contains three. The -ate member has one more oxygen in this pair.",visuals:[Ce("sulfate","Four oxygens"),Ce("sulfite","Three oxygens")]},{title:"Check the charges independently",text:"Both complete ions have charge −2. Removing an oxygen in this naming comparison does not mean subtracting 2 from the displayed ion charge."}],answer:"Sulfate has one more oxygen than sulfite. Both retain charge −2.",answerVisual:Ce("sulfite","Sulfite: memorise the complete ion")}],checks:[{id:"ate-ite-relative",kind:"choice",prompt:"What can you safely conclude about these two verified pairs?",options:[{id:"relative",label:"The -ate ion has one more oxygen than its corresponding -ite ion."},{id:"absolute",label:"Every -ate ion contains exactly four oxygen atoms."},{id:"charge",label:"Every -ite ion has charge −1."}],correct:"relative",explanation:"The comparison is relative within a family. Nitrate/nitrite have −1 charges; sulfate/sulfite have −2 charges, and their oxygen counts differ between families."},{id:"nitrate-nitrite-match",kind:"match",prompt:"Match each nitrogen oxyanion to its complete formula.",pairs:[{id:"nitrate",left:"Nitrate",right:"NO₃⁻",rightVisual:Ce("nitrate","Nitrate formula")},{id:"nitrite",left:"Nitrite",right:"NO₂⁻",rightVisual:Ce("nitrite","Nitrite formula")}],explanation:"Nitrate is NO₃⁻ and nitrite is NO₂⁻. The oxygen count changes by one while the −1 charge stays the same."}],summary:["Within the nitrate/nitrite and sulfate/sulfite pairs, -ate contains one more oxygen.","The charge is unchanged within these particular pairs.","A name ending alone cannot predict an unfamiliar ion’s complete formula or charge."],sources:[yc,b0]},{id:"ion-hydrogen",stage:"ions",title:"Hydrogen-Containing Ions",zh:"含氢离子的名称与电荷",intro:"Carbonate and phosphate form useful protonation families. Follow both the hydrogen count and the arithmetic of adding a hydrogen ion, H⁺.",objectives:["Compare carbonate with hydrogen carbonate.","Follow the phosphate, hydrogen phosphate and dihydrogen phosphate sequence.","Use charge addition correctly in these specific protonation examples."],sections:[{title:"Carbonate accepts one proton",text:"Carbonate has charge −2. Adding H⁺ introduces one hydrogen atom and one unit of positive charge, producing hydrogen carbonate with charge −1: −2 + 1 = −1. The carbon and oxygen counts stay unchanged. Hydrogen carbonate is also commonly called bicarbonate.",visuals:[Ce("carbonate","Carbonate","C: 1 · O: 3 · charge −2"),{label:"Add one proton",body:"H",charge:1},Ce("hydrogen-carbonate","Hydrogen carbonate","H: 1 · C: 1 · O: 3 · charge −1")]},{title:"Phosphate changes one proton at a time",text:"Starting with phosphate, adding one H⁺ gives hydrogen phosphate: −3 + 1 = −2. Adding another H⁺ gives dihydrogen phosphate: −2 + 1 = −1. The prefix dihydrogen records two hydrogens in the ion, not a charge of −2. These examples illustrate proton addition; merely finding hydrogen in any formula is not a universal charge rule.",visuals:[Ce("phosphate","Phosphate","0 H · −3"),Ce("hydrogen-phosphate","Hydrogen phosphate","1 H · −2"),Ce("dihydrogen-phosphate","Dihydrogen phosphate","2 H · −1")]}],examples:[{id:"carbonate-protonation",title:"Build hydrogen carbonate from a known ion",prompt:"What formula and charge result when carbonate accepts one H⁺?",steps:[{title:"Start with the known ion",text:"Carbonate contains one carbon and three oxygens and carries charge −2.",visuals:[Ce("carbonate","Starting ion")]},{title:"Add the particle specified",text:"H⁺ adds one hydrogen to the composition and +1 to the charge. It is not the addition of a neutral hydrogen atom."},{title:"Add charges and name the result",text:"−2 + 1 = −1. The resulting group contains H, C and three O atoms: hydrogen carbonate.",visuals:[Ce("hydrogen-carbonate","Result")]}],answer:"Hydrogen carbonate is HCO₃⁻, with charge −1.",answerVisual:Ce("hydrogen-carbonate","Hydrogen carbonate")},{id:"phosphate-protonation",title:"Follow the second hydrogen in the phosphate family",prompt:"Hydrogen phosphate accepts another H⁺. What changes?",steps:[{title:"Read the starting formula",text:"Hydrogen phosphate already contains one H, one P and four O atoms; its charge is −2.",visuals:[Ce("hydrogen-phosphate","Starting ion")]},{title:"Add one more H⁺",text:"The hydrogen count increases from one to two. P and O counts do not change."},{title:"Calculate the new charge",text:"−2 + 1 = −1. The resulting name is dihydrogen phosphate.",visuals:[Ce("dihydrogen-phosphate","Two hydrogens, charge −1")]}],answer:"Dihydrogen phosphate is H₂PO₄⁻, not an ion with charge −2.",answerVisual:Ce("dihydrogen-phosphate","Dihydrogen phosphate")}],checks:[{id:"hydrogen-charge-choice",kind:"choice",prompt:"Phosphate accepts one H⁺. Which formula and charge are correct?",options:[{id:"correct",label:"Hydrogen phosphate, HPO₄²⁻",visual:Ce("hydrogen-phosphate","Hydrogen phosphate")},{id:"unchanged",label:"HPO₄³⁻: the hydrogen count changes but charge does not"},{id:"opposite",label:"HPO₄⁴⁻: adding H⁺ makes the ion more negative"}],correct:"correct",explanation:"Charge must be conserved: −3 + (+1) = −2. One proton adds one H, so the formula is HPO₄²⁻."},{id:"hydrogen-family-order",kind:"order",prompt:"Arrange the phosphate family from zero to two hydrogen atoms.",items:[{id:"two",label:"Dihydrogen phosphate · H₂PO₄⁻"},{id:"zero",label:"Phosphate · PO₄³⁻"},{id:"one",label:"Hydrogen phosphate · HPO₄²⁻"}],correctOrder:["zero","one","two"],explanation:"The H count runs 0 → 1 → 2, while adding H⁺ changes the charge from −3 → −2 → −1. This is the specific phosphate protonation sequence."}],summary:["Adding H⁺ adds one hydrogen and raises total charge by +1 in these examples.","Carbonate → hydrogen carbonate: −2 → −1.","Phosphate → hydrogen phosphate → dihydrogen phosphate: −3 → −2 → −1."],sources:[x0,{title:"Open University · Oxoacids and phosphate protonation",url:"https://www.open.edu/openlearn/mod/oucontent/view.php?id=20880&section=3.2"}]},{id:"ion-oxyanions",stage:"ions",title:"The Chlorine Oxyanion Series",zh:"氯的含氧阴离子系列",intro:"A four-member family needs both prefixes and endings. Learn the complete chlorine sequence, including chlorite as a reference ion.",objectives:["Place the four chlorine oxyanions in oxygen-count order.","Connect hypo- and per- to the correct family members.","Keep the common −1 charge separate from changing oxygen counts."],sections:[{title:"One chlorine, one through four oxygens",text:"Hypochlorite, chlorite, chlorate and perchlorate each contain one chlorine atom. Their oxygen counts are one, two, three and four, respectively, and all four ions have charge −1. Chlorite fills the gap between hypochlorite and chlorate; it is included as a reference item for this lesson.",visuals:[Ce("hypochlorite","Hypochlorite","1 oxygen · −1"),Ce("chlorite","Chlorite","2 oxygens · −1 · reference"),Ce("chlorate","Chlorate","3 oxygens · −1"),Ce("perchlorate","Perchlorate","4 oxygens · −1")]},{title:"Use the family as the frame of reference",text:"Take chlorate as the familiar -ate member. Chlorite has one fewer oxygen. Hypochlorite has one fewer oxygen again, and perchlorate has one more oxygen than chlorate. The prefixes compare oxygen content within this chlorine family; they do not mean that every per- ion everywhere must contain four oxygen atoms.",visuals:[Ce("chlorate","Anchor: chlorate"),Ce("chlorite","One oxygen fewer than chlorate"),Ce("hypochlorite","Fewest oxygens in this four-ion family"),Ce("perchlorate","Most oxygens in this four-ion family")]}],examples:[{id:"chlorite-between",title:"Locate chlorite in the complete series",prompt:"How does chlorite fit between hypochlorite and chlorate?",steps:[{title:"Hold chlorine count fixed",text:"Each member contains exactly one Cl atom; the name changes with the oxygen count, not with an extra chlorine."},{title:"Use the chlorate anchor",text:"The verified chlorate formula has three oxygen atoms and charge −1.",visuals:[Ce("chlorate","Three oxygens")]},{title:"Move to the -ite member",text:"One fewer oxygen gives chlorite with two oxygens. The known charge of this family remains −1.",visuals:[Ce("chlorite","Two oxygens")]},{title:"Check its neighbours",text:"Hypochlorite has one oxygen and perchlorate has four. The ordered oxygen counts are 1, 2, 3, 4.",visuals:[Ce("hypochlorite","One oxygen"),Ce("perchlorate","Four oxygens")]}],answer:"Chlorite is ClO₂⁻: one oxygen more than hypochlorite and one fewer than chlorate.",answerVisual:Ce("chlorite","Chlorite · reference ion")}],checks:[{id:"chlorine-series-order",kind:"order",prompt:"Arrange these chlorine oxyanions from fewest to most oxygen atoms.",items:[{id:"per",label:"Perchlorate · ClO₄⁻"},{id:"ite",label:"Chlorite · ClO₂⁻"},{id:"hypo",label:"Hypochlorite · ClO⁻"},{id:"ate",label:"Chlorate · ClO₃⁻"}],correctOrder:["hypo","ite","ate","per"],explanation:"The oxygen counts are 1, 2, 3 and 4: hypochlorite → chlorite → chlorate → perchlorate. All four complete ions retain charge −1."},{id:"chlorite-charge",kind:"choice",prompt:"Chlorite has two oxygen atoms. What is its verified ionic charge?",options:[{id:"minus-one",label:"−1"},{id:"minus-two",label:"−2, because the oxygen subscript is 2"},{id:"positive",label:"+1"}],correct:"minus-one",explanation:"The charge is −1. The subscript 2 counts oxygen atoms and is not the charge magnitude."}],summary:["Learn the chlorine series as oxygen counts 1 → 2 → 3 → 4.","Hypochlorite → chlorite → chlorate → perchlorate all carry −1.","Prefixes and endings compare relatives; verified reference formulas remain essential."],sources:[b0,v0,yc]},{id:"ion-exceptions",stage:"ions",title:"Important Ions to Memorise",zh:"需要重点记忆的离子",intro:"Patterns help, but reliable recall also needs a small set of complete ion identities. Ammonium, acetate and permanganate are useful examples of why the sign, composition and name must stay connected.",objectives:["Explain why ammonium is a polyatomic cation.","Recall the complete acetate and permanganate formulas and charges.","Recognise the limits of guessing formulas from a name ending."],sections:[{title:"Ammonium breaks the “all polyatomic ions are negative” shortcut",text:"Ammonium is NH₄⁺. Its nitrogen and hydrogen atoms form one bonded group with one fewer electron than protons overall. That net +1 makes it a cation; the presence of several atoms does not force a negative charge. Read the superscript rather than making an assumption from the word polyatomic.",visuals:[Ce("ammonium","Ammonium","Positive polyatomic ion · +1")]},{title:"Learn acetate and permanganate as complete units",text:"Acetate is commonly written CH₃COO⁻ and contains two carbons, three hydrogens and two oxygens; the group carries −1. The equivalent composition C₂H₃O₂⁻ is also widely used. Permanganate is MnO₄⁻: one manganese, four oxygens and charge −1. Its four oxygens do not make its charge the same as sulfate’s −2.",visuals:[Ce("acetate","Acetate","C: 2 · H: 3 · O: 2 · −1"),{label:"Equivalent acetate composition",body:"C2H3O2",charge:-1,caption:"Same ion composition, a different common notation"},Ce("permanganate","Permanganate","Mn: 1 · O: 4 · −1"),Ce("sulfate","Compare sulfate","S: 1 · O: 4 · −2")]}],examples:[{id:"ammonium-net-charge",title:"Explain ammonium’s positive sign",prompt:"How can a group containing several atoms still be a cation?",steps:[{title:"Count positive nuclear charges",text:"One nitrogen contributes seven protons and four hydrogens contribute four: 7 + 4 = 11 protons in the group."},{title:"Compare with the ion’s electrons",text:"An ammonium ion has ten electrons in total. The positive and negative charges therefore differ by one unit."},{title:"Read the net result",text:"11 − 10 = +1. This calculation describes the complete ammonium ion; it does not assign +1 separately to every atom.",visuals:[Ce("ammonium","A group with net +1")]}],answer:"Ammonium is a polyatomic cation because the whole NH₄ group has net charge +1.",answerVisual:Ce("ammonium","Ammonium")}],checks:[{id:"memorise-special-match",kind:"match",prompt:"Match these important ions to their complete formulas.",pairs:[{id:"nh4",left:"Ammonium",right:"NH₄⁺",rightVisual:Ce("ammonium","Ammonium formula")},{id:"acetate",left:"Acetate",right:"CH₃COO⁻",rightVisual:Ce("acetate","Acetate formula")},{id:"permanganate",left:"Permanganate",right:"MnO₄⁻",rightVisual:Ce("permanganate","Permanganate formula")}],explanation:"Ammonium carries +1; acetate and permanganate each carry −1. Keep the whole formula with the sign when memorising."},{id:"oxygen-charge-shortcut",kind:"choice",prompt:"Permanganate and sulfate both contain four oxygens. Which conclusion is correct?",options:[{id:"individual",label:"Their verified charges differ: permanganate is −1 and sulfate is −2."},{id:"same",label:"The oxygen count forces both ions to have the same charge."},{id:"ammonium",label:"Only single-atom ions can carry a positive charge."}],correct:"individual",explanation:"Oxygen count alone does not set the net ionic charge. Permanganate is MnO₄⁻, sulfate is SO₄²⁻, and ammonium shows that a polyatomic ion can be positive."}],summary:["Ammonium is the positive NH₄⁺ group.","Memorise acetate CH₃COO⁻ and permanganate MnO₄⁻ with their −1 charges.","Use patterns to organise verified facts, never to replace the formula and charge."],sources:[x0,yc]}],Lf=[{id:"compound-introduction",stage:"compounds",title:"Introduction to Chemical Compounds",zh:"认识化合物",intro:"Begin with what a formula represents. Naming becomes easier when you can distinguish an element, a molecule, an ion and an ionic formula unit.",objectives:["Distinguish elements from compounds without assuming every molecule is a compound.","Recognise cations and anions and distinguish a neutral formula from a charged ion.","Read subscripts as atom counts or ion ratios in the appropriate context."],sections:[{title:"One element or more than one?",text:"An element contains one kind of atom. A compound contains atoms of at least two different elements chemically combined in a definite composition. A molecule is a discrete bonded group: O₂ is a molecule of an element, whereas CO₂ is a molecule of a compound. A mixture is not given a single fixed compound formula just because its components are close together.",visuals:[{label:"An element molecule",formula:"O2",caption:"Two oxygen atoms, only one element."},{label:"A compound molecule",compoundId:"carbon-dioxide",caption:"Carbon and oxygen are chemically combined."}]},{title:"Charged particles and neutral substances",text:"An ion has a net electrical charge. A cation is positive and an anion is negative; the charge is written as a superscript. Na⁺ and Cl⁻ are ions. CO₂ is a neutral molecule. Ionic solids such as NaCl and MgO contain extended arrangements of oppositely charged ions, rather than separate neutral NaCl or MgO molecules. Their formulas show the simplest whole-number ratio of ions.",visuals:[{label:"Sodium cation",body:"Na",charge:1},{label:"Chloride anion",body:"Cl",charge:-1},{label:"Ionic formula unit",compoundId:"sodium-chloride",caption:"One Na⁺ for each Cl⁻."},{label:"Another ionic compound",compoundId:"magnesium-oxide",caption:"One Mg²⁺ for each O²⁻."}]},{title:"Read a formula carefully",text:"An element symbol starts with a capital letter; any second letter is lower-case. A subscript counts the preceding atom or whole parenthesised group. When no subscript is written, the count is one. In CO₂, one molecule contains one carbon atom and two oxygen atoms. In MgO, the ion ratio is one magnesium ion to one oxide ion. A subscript is not an ionic charge.",visuals:[{label:"One carbon and two oxygen atoms",compoundId:"carbon-dioxide"},{label:"One magnesium ion and one oxide ion",compoundId:"magnesium-oxide"}]}],examples:[{id:"intro-read-formulas",title:"Read before naming",prompt:"What do NaCl, MgO and CO₂ tell us?",steps:[{title:"Identify the element symbols",text:"Na and Cl, Mg and O, and C and O are three pairs of different elements. Each formula therefore represents a compound."},{title:"Identify the kind of particle",text:"The usual solid forms of NaCl and MgO are ionic arrangements. CO₂ consists of neutral covalent molecules."},{title:"Read the numbers in context",text:"NaCl and MgO each have a simplest ion ratio of 1:1. A CO₂ molecule has 1 carbon atom and 2 oxygen atoms; its subscript describes actual molecular composition."}],answer:"All three are compounds; NaCl and MgO are ionic, while CO₂ is molecular.",answerVisual:{label:"Molecular comparison",compoundId:"carbon-dioxide"}}],checks:[{id:"intro-match-particles",kind:"match",prompt:"Match each representation to its meaning.",pairs:[{id:"oxygen",left:"O₂",right:"A molecule of an element",leftVisual:{label:"Oxygen",formula:"O2"}},{id:"carbon-dioxide",left:"CO₂",right:"A neutral molecule of a compound",leftVisual:{label:"Carbon dioxide",compoundId:"carbon-dioxide"}},{id:"sodium-ion",left:"Na⁺",right:"A positive ion (cation)",leftVisual:{label:"Sodium",body:"Na",charge:1}},{id:"salt",left:"NaCl",right:"A neutral ionic formula unit",leftVisual:{label:"Sodium chloride",compoundId:"sodium-chloride"}}],explanation:"O₂ has only oxygen atoms, CO₂ contains two elements in neutral molecules, Na⁺ carries positive charge, and NaCl records the 1:1 ratio of opposite ions."},{id:"intro-ion-ratio",kind:"choice",prompt:"Which statement best describes solid NaCl?",options:[{id:"molecules",label:"It consists of separate neutral NaCl molecules."},{id:"ions",label:"It contains Na⁺ and Cl⁻ ions in an extended arrangement with a 1:1 ratio."},{id:"charged",label:"Each formula unit has an overall +1 charge."}],correct:"ions",explanation:"In this ionic solid, the attractions extend through the crystal. One +1 sodium ion balances one −1 chloride ion, so the formula unit is neutral."}],summary:["A compound contains more than one element; a molecule can contain either one element or several.","Cations are positive and anions are negative. Ionic formula units balance their charges.","Always decide whether subscripts represent molecular atom counts or an ionic ratio."],sources:[{title:"OpenStax Chemistry 2e · Phases and Classification of Matter",url:"https://openstax.org/books/chemistry-2e/pages/1-2-phases-and-classification-of-matter"},{title:"OpenStax Chemistry 2e · Chemical Formulas",url:"https://openstax.org/books/chemistry-2e/pages/2-4-chemical-formulas"},{title:"OpenStax Chemistry 2e · Ionic and Molecular Compounds",url:"https://openstax.org/books/chemistry-2e/pages/2-6-ionic-and-molecular-compounds"}]},{id:"compound-binary",stage:"compounds",title:"Binary Ionic Compounds",zh:"二元离子化合物命名",intro:"Learn a repeatable naming process for a fixed-charge metal combined with a single-element anion. The formula ratio follows the charges; the name does not use molecular prefixes.",objectives:["Name the cation before the anion.","Change the nonmetal name to its monatomic anion name ending in -ide.","Explain the neutral ratios in MgO, CaCl₂ and Al₂O₃."],sections:[{title:"Cation name + anion name",text:"For these binary ionic compounds, name the positive metal ion first, then the negative monatomic ion. The metal keeps its element name: sodium, magnesium, calcium or aluminium. The nonmetal uses an anion name: chlorine becomes chloride, oxygen becomes oxide, sulfur becomes sulfide and nitrogen becomes nitride. Chloride names Cl⁻, not neutral chlorine atoms or Cl₂ molecules.",visuals:[{label:"Sodium chloride",compoundId:"sodium-chloride"},{label:"Magnesium oxide",compoundId:"magnesium-oxide"},{label:"Calcium chloride",compoundId:"calcium-chloride"}]},{title:"Charges determine the smallest ratio",text:"The whole ionic formula is neutral. Calcium is +2 and chloride is −1, so one calcium ion needs two chloride ions. Aluminium is +3 and oxide is −2: the smallest matching charge total is 6, from two aluminium ions and three oxide ions. Do not name CaCl₂ calcium dichloride in this ionic naming system. The subscript is a ratio required by the ion charges, not a molecular prefix in the name.",visuals:[{label:"Calcium",body:"Ca",charge:2},{label:"Chloride",body:"Cl",charge:-1},{label:"Aluminium oxide",compoundId:"aluminium-oxide",caption:"2(+3) + 3(−2) = 0"}]}],examples:[{id:"binary-mgo",title:"Name MgO",prompt:"How do we name MgO?",steps:[{title:"Recognise the ions",text:"Mg is magnesium, a fixed +2 metal cation. O represents oxide, O²⁻, in this ionic compound."},{title:"Check the ratio",text:"One +2 ion balances one −2 ion. The formula therefore needs no written subscript of 1."},{title:"Join the ion names",text:"Put magnesium first, then oxide. Ionic names do not add mono- for the one oxide ion."}],answer:"Magnesium oxide",answerVisual:{label:"Magnesium oxide",compoundId:"magnesium-oxide"}},{id:"binary-cacl2",title:"Name CaCl₂",prompt:"Why is CaCl₂ calcium chloride?",steps:[{title:"Name the positive ion",text:"Ca²⁺ is the calcium cation. Its name remains calcium."},{title:"Name and count the negative ions",text:"Each Cl⁻ is chloride. Two chlorides give −2 and balance one Ca²⁺: +2 + 2(−1) = 0."},{title:"Apply the naming structure",text:"Use cation name + anion name. Keep the formula subscript, but do not insert di- into the ionic name."}],answer:"Calcium chloride",answerVisual:{label:"Calcium chloride",compoundId:"calcium-chloride"}},{id:"binary-al2o3",title:"Name Al₂O₃",prompt:"How do the charges explain Al₂O₃?",steps:[{title:"Identify both ion names",text:"Al³⁺ is aluminium; O²⁻ is oxide."},{title:"Check electrical neutrality",text:"Two aluminium ions contribute +6 and three oxide ions contribute −6. The ion ratio 2:3 is already the smallest whole-number ratio."},{title:"Build the name",text:"Name aluminium before oxide. Aluminium uses the fixed +3 ion in this course, so a Roman numeral is not required."}],answer:"Aluminium oxide",answerVisual:{label:"Aluminium oxide",compoundId:"aluminium-oxide"}}],checks:[{id:"binary-match-names",kind:"match",prompt:"Match the ionic formulas to their names.",pairs:[{id:"mgo",left:"MgO",right:"Magnesium oxide",leftVisual:{label:"MgO",compoundId:"magnesium-oxide"}},{id:"cacl2",left:"CaCl₂",right:"Calcium chloride",leftVisual:{label:"CaCl₂",compoundId:"calcium-chloride"}},{id:"al2o3",left:"Al₂O₃",right:"Aluminium oxide",leftVisual:{label:"Al₂O₃",compoundId:"aluminium-oxide"}}],explanation:"The metal name comes first. Oxygen becomes oxide and chlorine becomes chloride. These fixed-charge ionic compounds do not use numerical prefixes."},{id:"binary-fix-name",kind:"choice",prompt:"A learner calls CaCl₂ “calcium dichloride”. What should change?",options:[{id:"prefix",label:"Remove di-: the correct ionic name is calcium chloride."},{id:"cation",label:"Change calcium to calciide."},{id:"formula",label:"Change the formula to CaCl so the name can omit di-."}],correct:"prefix",explanation:"The two chlorides are already implied by Ca²⁺ and Cl⁻ charge balance. Keep CaCl₂ and use calcium chloride; di- belongs to a different naming system."}],summary:["Name the cation first and the monatomic anion second.","Use chloride, oxide and other established -ide anion names.","Ionic subscripts express the smallest neutral ratio; they do not create molecular prefixes."],sources:[{title:"OpenStax Chemistry 2e · Ionic and Molecular Compounds",url:"https://openstax.org/books/chemistry-2e/pages/2-6-ionic-and-molecular-compounds"},{title:"OpenStax Chemistry 2e · Chemical Nomenclature",url:"https://openstax.org/books/chemistry-2e/pages/2-7-chemical-nomenclature"}]},{id:"compound-polyatomic",stage:"compounds",title:"Polyatomic Ionic Compounds",zh:"含多原子离子的化合物",intro:"Treat a polyatomic ion as one charged unit. Its established name survives inside the compound name, and any repeated whole ion needs parentheses in the formula.",objectives:["Preserve names such as carbonate, sulfate and hydroxide.","Balance Al³⁺ and SO₄²⁻ using the smallest whole-number ratio.","Explain how parentheses multiply a complete polyatomic group."],sections:[{title:"Keep the ion together",text:"A polyatomic ion contains several bonded atoms with one net charge. When naming a compound, keep the established ion name intact: CaCO₃ contains calcium ions and carbonate ions, so it is calcium carbonate. Do not change carbonate to a new -ide name or confuse it with a neutral carbon dioxide molecule. The covalent bonding within the ion and the ionic attractions between ions are different levels of description.",visuals:[{label:"Calcium carbonate",compoundId:"calcium-carbonate"},{label:"Carbonate ion",body:"CO3",charge:-2},{label:"Sulfate ion",body:"SO4",charge:-2}]},{title:"Parentheses count whole ions",text:"Aluminium sulfate combines Al³⁺ and SO₄²⁻. Two aluminium ions balance three sulfate ions, so the formula is Al₂(SO₄)₃. The outside 3 multiplies the complete SO₄ group, giving 3 sulfur atoms and 12 oxygen atoms. If only one polyatomic ion is needed, omit those parentheses, as in CaCO₃. A subscript attached to a single atom cannot substitute for a whole-group multiplier.",visuals:[{label:"Aluminium cation",body:"Al",charge:3},{label:"Sulfate anion",body:"SO4",charge:-2},{label:"Three complete sulfates",compoundId:"aluminium-sulfate",caption:"Al:S:O = 2:3:12"}]},{title:"A polyatomic cation can also repeat",text:"Ammonium, NH₄⁺, is a positive polyatomic ion. In ammonium carbonate, two whole ammonium ions balance one carbonate ion: 2(+1) + (−2) = 0. The formula (NH₄)₂CO₃ has parentheses around ammonium, not around the single carbonate. Choose parentheses from the ion grouping, not from whether the ion is positive or negative.",visuals:[{label:"Ammonium carbonate",compoundId:"ammonium-carbonate"},{label:"Calcium nitrate",compoundId:"calcium-nitrate",caption:"Two whole nitrate ions: N:O = 2:6."}]}],examples:[{id:"polyatomic-aluminium-sulfate",title:"Construct aluminium sulfate",prompt:"How do Al³⁺ and SO₄²⁻ form a neutral formula?",steps:[{title:"Identify the ions and charges",text:"The cation is aluminium, Al³⁺. The anion is sulfate, SO₄²⁻. Retain sulfate as a single named unit.",visuals:[{label:"Aluminium",body:"Al",charge:3},{label:"Sulfate",body:"SO4",charge:-2}]},{title:"Find a shared charge total",text:"The smallest positive total divisible by 3 and 2 is 6. Two Al³⁺ ions supply +6; three SO₄²⁻ ions supply −6."},{title:"Write the ion ratio",text:"Use aluminium:sulfate = 2:3. Put the cation first and attach 2 to Al."},{title:"Group the repeated anion",text:"Three sulfates require (SO₄)₃. The outside 3 acts on both S and all four O atoms; Al₂SO₄₃ would describe the wrong counts."},{title:"Verify the completed formula",text:"2(+3) + 3(−2) = 0. The ratio is smallest and the formula is Al₂(SO₄)₃; the name remains aluminium sulfate."}],answer:"Aluminium sulfate — Al₂(SO₄)₃",answerVisual:{label:"Aluminium sulfate",compoundId:"aluminium-sulfate"}}],checks:[{id:"polyatomic-order",kind:"order",prompt:"Arrange the reasoning for constructing aluminium sulfate.",items:[{id:"group",label:"Write Al₂(SO₄)₃ with parentheses around the three sulfates."},{id:"charges",label:"Identify Al³⁺ and SO₄²⁻."},{id:"verify",label:"Verify 2(+3) + 3(−2) = 0 and the ratio cannot be reduced."},{id:"ratio",label:"Find the smallest aluminium:sulfate ratio, 2:3."}],correctOrder:["charges","ratio","group","verify"],explanation:"Start with verified ion charges, then find the smallest ratio, write the complete groups and finally check neutrality. Swapping subscripts without identifying the ions does not explain the formula."},{id:"polyatomic-oxygen",kind:"choice",prompt:"How many oxygen atoms are represented in one formula unit of Al₂(SO₄)₃?",options:[{id:"4",label:"4"},{id:"7",label:"7"},{id:"12",label:"12"}],correct:"12",explanation:"The outside subscript 3 multiplies all four oxygen atoms inside each sulfate: 3 × 4 = 12. It also multiplies sulfur, giving three sulfur atoms."}],summary:["Keep polyatomic ion names unchanged in compound names.","Balance charges using complete ions and the smallest whole-number ratio.","Use parentheses when more than one whole polyatomic ion is present."],sources:[{title:"OpenStax Chemistry 2e · Ionic and Molecular Compounds",url:"https://openstax.org/books/chemistry-2e/pages/2-6-ionic-and-molecular-compounds"},{title:"OpenStax Chemistry 2e · Chemical Nomenclature",url:"https://openstax.org/books/chemistry-2e/pages/2-7-chemical-nomenclature"},{title:"OpenStax Chemistry 2e · Chemical Formulas",url:"https://openstax.org/books/chemistry-2e/pages/2-4-chemical-formulas"}]},{id:"compound-variable",stage:"compounds",title:"Variable-Charge Metals",zh:"可变价金属与罗马数字",intro:"A metal can have more than one oxidation state. Use electrical neutrality to find the state, then record it as a Roman numeral in the name.",objectives:["Distinguish iron(II) chloride from iron(III) chloride.","Use the known anion charge to calculate the metal oxidation state.","Explain why the Roman numeral describes each metal atom rather than the metal subscript."],sections:[{title:"The same metal, different compounds",text:"FeCl₂ and FeCl₃ both contain iron and chloride, but they are different compounds. Each chloride is −1. Two chlorides require iron to be +2 in FeCl₂; three require +3 in FeCl₃. Their names are iron(II) chloride and iron(III) chloride. Omitting the numeral loses essential information. The Roman numeral has no plus sign in the compound name.",visuals:[{label:"Iron(II) chloride",compoundId:"iron-ii-chloride",caption:"x + 2(−1) = 0 → x = +2 → II"},{label:"Iron(III) chloride",compoundId:"iron-iii-chloride",caption:"x + 3(−1) = 0 → x = +3 → III"}]},{title:"Oxidation states and charge bookkeeping",text:"For a monatomic metal ion, its oxidation state equals its ion charge. In a neutral compound, the sum of oxidation states multiplied by atom counts is zero. Use oxide as −2 in these ordinary metal oxides; do not apply that assumption to every possible oxygen compound, such as peroxides. If several metal atoms share a total positive charge, divide by their number to find the state of each atom.",visuals:[{label:"Iron(III) oxide",compoundId:"iron-iii-oxide",caption:"Two Fe atoms each have oxidation state +3."},{label:"Copper(I) oxide",compoundId:"copper-i-oxide",caption:"2x + (−2) = 0 → each Cu is +1."}]},{title:"Write the numeral in the correct place",text:"Use I, II, III, IV, V and VI for oxidation states +1 through +6. Place the numeral in parentheses immediately after the metal name: iron(III) oxide. It does not count metal atoms and it is not the total charge of all metal ions. In this course, sodium, magnesium, calcium, aluminium, zinc and silver use their stated fixed charges and do not need variable-charge-metal numerals."}],examples:[{id:"variable-fe2o3",title:"Name Fe₂O₃ step by step",prompt:"How do we name Fe₂O₃?",steps:[{title:"Identify the metal and nonmetal",text:"Fe is iron, a variable-charge metal. O is oxygen and is named oxide in this binary ionic compound."},{title:"Determine oxygen’s oxidation state",text:"In this ordinary metal oxide, each oxygen has oxidation state −2. Three oxygen atoms contribute 3(−2) = −6."},{title:"Calculate iron’s oxidation state",text:"Let x be the oxidation state of each iron atom. Neutrality gives 2x + 3(−2) = 0, so 2x = 6 and x = +3."},{title:"Choose the Roman numeral",text:"The state +3 corresponds to III. The subscript 2 on Fe counts two iron atoms; it does not call for the numeral II."},{title:"Construct the complete name",text:"Keep iron as the cation name, add (III), then oxide. Read the numeral as “three” when saying the chemical name."}],answer:"Iron(III) oxide",answerVisual:{label:"Iron(III) oxide",compoundId:"iron-iii-oxide"}}],checks:[{id:"variable-choose-roman",kind:"choice",prompt:"Fe₂O₃ contains two iron atoms. Which numeral belongs in its name?",options:[{id:"ii",label:"II, because the subscript on Fe is 2."},{id:"iii",label:"III, because each iron atom has oxidation state +3."},{id:"vi",label:"VI, because both iron atoms together contribute +6."}],correct:"iii",explanation:"Three oxide ions contribute −6. The two iron atoms must total +6, so each is +3: iron(III) oxide. The numeral is neither an atom count nor the combined metal charge."},{id:"variable-match-names",kind:"match",prompt:"Match each iron formula to its complete name.",pairs:[{id:"fecl2",left:"FeCl₂",right:"Iron(II) chloride",leftVisual:{label:"FeCl₂",compoundId:"iron-ii-chloride"}},{id:"fecl3",left:"FeCl₃",right:"Iron(III) chloride",leftVisual:{label:"FeCl₃",compoundId:"iron-iii-chloride"}},{id:"fe2o3",left:"Fe₂O₃",right:"Iron(III) oxide",leftVisual:{label:"Fe₂O₃",compoundId:"iron-iii-oxide"}}],explanation:"Chloride is −1 and ordinary oxide is −2. Balance the total anion charge, divide across any multiple iron atoms and name the state of each iron atom."}],summary:["Roman numerals distinguish different oxidation states of a variable-charge metal.","Multiply each known anion state by its count, then use a zero total for a neutral formula.","Divide the required metal charge among the metal atoms; the numeral describes each atom."],sources:[{title:"OpenStax Chemistry 2e · Ionic and Molecular Compounds",url:"https://openstax.org/books/chemistry-2e/pages/2-6-ionic-and-molecular-compounds"},{title:"OpenStax Chemistry 2e · Chemical Nomenclature",url:"https://openstax.org/books/chemistry-2e/pages/2-7-chemical-nomenclature"},{title:"OpenStax Chemistry 2e · Oxidation States",url:"https://openstax.org/books/chemistry-2e/pages/4-2-classifying-chemical-reactions"}],calculator:!0},{id:"compound-molecular",stage:"compounds",title:"Molecular Compounds",zh:"分子化合物与数字前缀",intro:"Molecular names need to tell us the actual atom counts. Carbon monoxide and carbon dioxide illustrate why names cannot rely on element identities alone.",objectives:["Use the prefixes mono- through deca- to interpret atom counts.","Apply common first-element and vowel-contraction conventions.","Keep molecular formulas distinct from their reduced empirical ratios."],sections:[{title:"Count the atoms in the molecule",text:"For the binary molecular compounds in these exercises, name the first element and then the second element with an -ide ending. Attach numerical prefixes to show the actual counts. The usual teaching names omit mono- on the first element when its count is one. CO is carbon monoxide; CO₂ is carbon dioxide. Their different atom counts describe different substances. This prefix system is different from naming fixed-charge ionic compounds.",visuals:[{label:"One oxygen",compoundId:"carbon-monoxide"},{label:"Two oxygen atoms",compoundId:"carbon-dioxide"},{label:"Two nitrogen and four oxygen atoms",compoundId:"dinitrogen-tetroxide"}]},{title:"Build the prefix vocabulary",text:"Learn these count–prefix pairs: 1 mono-, 2 di-, 3 tri-, 4 tetra-, 5 penta-, 6 hexa-, 7 hepta-, 8 octa-, 9 nona-, 10 deca-. Prefixes name the atoms actually present; they do not indicate ion charges. Conventional teaching names include vowel contractions such as monoxide, tetroxide and pentoxide. Learn the listed standard names rather than inventing a universal vowel-deletion rule."},{title:"Do not simplify a molecular identity",text:"N₂O₄ is dinitrogen tetroxide, not nitrogen dioxide. Although the ratio 2:4 reduces to 1:2, NO₂ and N₂O₄ describe different molecules. An ionic formula uses the simplest neutral ion ratio; a molecular formula retains its actual molecular composition. Metal/nonmetal location is a useful introductory clue, not an exception-free law of bonding in every phase.",visuals:[{label:"Dinitrogen tetroxide",compoundId:"dinitrogen-tetroxide"},{label:"Nitrogen dioxide",compoundId:"nitrogen-dioxide"}]}],examples:[{id:"molecular-co",title:"Name CO",prompt:"Why is CO carbon monoxide?",steps:[{title:"Count both elements",text:"One molecule has one carbon atom and one oxygen atom."},{title:"Name the first element",text:"Use carbon. The first-element mono- is normally omitted in this naming convention."},{title:"Name the second element",text:"Use mono- with oxide and the conventional contraction monoxide."}],answer:"Carbon monoxide",answerVisual:{label:"Carbon monoxide",compoundId:"carbon-monoxide"}},{id:"molecular-co2",title:"Name CO₂",prompt:"How does an extra oxygen change the name?",steps:[{title:"Read the atom counts",text:"One carbon atom is followed by two oxygen atoms."},{title:"Apply the prefixes",text:"Keep carbon without mono-. Two oxygen atoms need di- before oxide."},{title:"Keep this identity distinct",text:"The name is carbon dioxide; it is not interchangeable with carbon monoxide."}],answer:"Carbon dioxide",answerVisual:{label:"Carbon dioxide",compoundId:"carbon-dioxide"}},{id:"molecular-n2o4",title:"Name N₂O₄",prompt:"How do both prefixes contribute to this name?",steps:[{title:"Read the full molecular formula",text:"The subscripts specify two nitrogen atoms and four oxygen atoms."},{title:"Name the first element count",text:"Two nitrogen atoms become dinitrogen."},{title:"Name the second element count",text:"Four oxygen atoms use tetra- with oxide, giving the conventional teaching name tetroxide."},{title:"Keep the subscripts intact",text:"Do not divide 2 and 4 by two. That would produce a different molecular formula and name."}],answer:"Dinitrogen tetroxide",answerVisual:{label:"Dinitrogen tetroxide",compoundId:"dinitrogen-tetroxide"}}],checks:[{id:"molecular-match",kind:"match",prompt:"Match each molecular formula to the name that preserves its counts.",pairs:[{id:"co",left:"CO",right:"Carbon monoxide",leftVisual:{label:"CO",compoundId:"carbon-monoxide"}},{id:"co2",left:"CO₂",right:"Carbon dioxide",leftVisual:{label:"CO₂",compoundId:"carbon-dioxide"}},{id:"n2o4",left:"N₂O₄",right:"Dinitrogen tetroxide",leftVisual:{label:"N₂O₄",compoundId:"dinitrogen-tetroxide"}}],explanation:"Mono- indicates one oxygen, di- indicates two and tetra- indicates four. Dinitrogen also preserves the two nitrogen atoms in N₂O₄."},{id:"molecular-no-reduction",kind:"choice",prompt:"A learner reduces N₂O₄ to NO₂ when writing dinitrogen tetroxide. Why is this incorrect?",options:[{id:"different",label:"A molecular formula gives actual atom counts; NO₂ is a different molecule."},{id:"charge",label:"The prefix di- means a +2 charge, so the sign is missing."},{id:"ionic",label:"Every molecular formula must have equal subscripts."}],correct:"different",explanation:"Dinitrogen tetroxide requires two nitrogen and four oxygen atoms. NO₂ is nitrogen dioxide. Simplifying a ratio does not preserve a molecular identity."}],summary:["Use prefixes to preserve the actual atom counts of these binary molecular compounds.","Usually omit first-element mono- and learn conventional names such as monoxide and tetroxide.","Molecular atom counts are not ionic charge ratios."],sources:[{title:"OpenStax Chemistry 2e · Chemical Nomenclature",url:"https://openstax.org/books/chemistry-2e/pages/2-7-chemical-nomenclature"},{title:"OpenStax Chemistry 2e · Chemical Formulas",url:"https://openstax.org/books/chemistry-2e/pages/2-4-chemical-formulas"},{title:"OpenStax Chemistry 2e · Ionic and Molecular Compounds",url:"https://openstax.org/books/chemistry-2e/pages/2-6-ionic-and-molecular-compounds"}]},{id:"compound-acids-hydrates",stage:"compounds",title:"Acids and Hydrates",zh:"酸与水合物",intro:"Some names require more context than the element counts. The aqueous state distinguishes common acid names, and a hydrate name records whole waters of crystallisation.",objectives:["Distinguish HCl(g), hydrogen chloride, from HCl(aq), hydrochloric acid.","Connect common oxyanion names to nitric and sulfuric acid without treating the pattern as universal.","Read a hydrate coefficient as a number of whole water molecules."],sections:[{title:"The aqueous state matters",text:"The symbol (aq) means dissolved in water; it is not an atom group or a subscript. HCl(g) is hydrogen chloride, whereas its aqueous solution is hydrochloric acid. For common binary aqueous acids, hydro- and an -ic acid ending are useful naming clues. Merely starting a formula with H does not establish that a substance is being named as an acid. Use the state and the known chemical context.",visuals:[{label:"Molecular gas",compoundId:"hydrogen-chloride",caption:"Hydrogen chloride, HCl(g)."},{label:"Aqueous acid",compoundId:"hydrochloric-acid",caption:"Hydrochloric acid, HCl(aq)."}]},{title:"Common oxyacid relationships",text:"For the common examples here, an anion name ending in -ate corresponds to an -ic acid name, and -ite corresponds to -ous acid. Nitrate leads to nitric acid; sulfate leads to sulfuric acid; sulfite leads to sulfurous acid. These oxyacid names do not add hydro-. Some stems change, as in sulfuric and phosphoric, so learn the established full names. Organic and other retained acid names are not all generated by these simple patterns.",visuals:[{label:"Nitric acid",compoundId:"nitric-acid",caption:"Nitrate → nitric acid."},{label:"Sulfuric acid",compoundId:"sulfuric-acid",caption:"Sulfate → sulfuric acid."},{label:"Sulfurous acid",compoundId:"sulfurous-acid",caption:"Sulfite → sulfurous acid, in this aqueous naming convention."}]},{title:"A hydrate includes whole waters",text:"A hydrate contains water in a defined crystalline composition. Name the salt first, keeping any required metal Roman numeral, then add a numerical prefix plus hydrate. In CuSO₄·5H₂O, the dot separates the salt from five whole water molecules per formula unit. The baseline 5 multiplies H₂O, not just H or O; it is not an ionic charge. Pentahydrate means five waters. Hydrate is a special composition category, not a claim that all bonding in the substance is of one type.",visuals:[{label:"Five waters",compoundId:"copper-ii-sulfate-pentahydrate",caption:"Copper(II) sulfate pentahydrate."},{label:"Seven waters",compoundId:"magnesium-sulfate-heptahydrate",caption:"Heptahydrate means seven waters."},{label:"Two waters",compoundId:"calcium-sulfate-dihydrate",caption:"Dihydrate means two waters."}]}],examples:[{id:"acid-hcl",title:"Distinguish two names",prompt:"How does the state change the name of HCl?",steps:[{title:"Read the complete formula",text:"Inspect the state symbol as well as the H and Cl symbols."},{title:"Select the appropriate context",text:"For HCl(g), use the molecular substance name hydrogen chloride. For HCl(aq), use the established aqueous acid name."},{title:"Construct the acid name",text:"The binary aqueous chloride acid is hydrochloric acid. Keep (aq) in its formula in these exercises."}],answer:"HCl(g): hydrogen chloride; HCl(aq): hydrochloric acid.",answerVisual:{label:"Aqueous acid",compoundId:"hydrochloric-acid"}},{id:"acid-oxyacids",title:"Name two oxyacids",prompt:"How do HNO₃(aq) and H₂SO₄(aq) connect to familiar ions?",steps:[{title:"Recognise the oxyanion groups",text:"The corresponding groups are nitrate, NO₃⁻, and sulfate, SO₄²⁻. Their different charges explain why one or two H atoms appear in the respective neutral acid formulas."},{title:"Use the established acid stems",text:"For these -ate ions, the acid names end in -ic acid. The retained stems give nitric acid and sulfuric acid; do not add hydro-."},{title:"Retain aqueous context",text:"Write HNO₃(aq) for nitric acid and H₂SO₄(aq) for sulfuric acid in this module."}],answer:"Nitric acid and sulfuric acid",answerVisual:{label:"Sulfuric acid",compoundId:"sulfuric-acid"}},{id:"hydrate-pentahydrate",title:"Name CuSO₄·5H₂O",prompt:"How do we name the salt and the water together?",steps:[{title:"Identify the salt core",text:"The part before the dot is CuSO₄. Sulfate has a −2 charge, so the copper is +2 in this 1:1 salt."},{title:"Name the salt",text:"Use copper(II) sulfate. The numeral identifies the copper oxidation state and remains part of the hydrate name."},{title:"Read the hydration number",text:"The coefficient 5 after the dot means five whole waters of crystallisation. Five corresponds to penta-."},{title:"Join the two parts",text:"Append pentahydrate to the complete salt name. Keep the formula as CuSO₄·5H₂O, with the 5 at baseline."}],answer:"Copper(II) sulfate pentahydrate",answerVisual:{label:"Copper(II) sulfate pentahydrate",compoundId:"copper-ii-sulfate-pentahydrate"}}],checks:[{id:"acids-hydrates-match",kind:"match",prompt:"Match each complete formula to its context-dependent name.",pairs:[{id:"hcl-gas",left:"HCl(g)",right:"Hydrogen chloride",leftVisual:{label:"Gas",compoundId:"hydrogen-chloride"}},{id:"hcl-aqueous",left:"HCl(aq)",right:"Hydrochloric acid",leftVisual:{label:"Aqueous",compoundId:"hydrochloric-acid"}},{id:"copper-hydrate",left:"CuSO₄·5H₂O",right:"Copper(II) sulfate pentahydrate",leftVisual:{label:"Hydrate",compoundId:"copper-ii-sulfate-pentahydrate"}}],explanation:"The state distinguishes the two HCl names. The hydrate dot and coefficient specify five waters in addition to the copper(II) sulfate salt."},{id:"hydrate-water-count",kind:"choice",prompt:"What does the 5 in CuSO₄·5H₂O count?",options:[{id:"water",label:"Five whole H₂O molecules per formula unit of salt."},{id:"copper",label:"Five copper ions in each sulfate group."},{id:"charge",label:"A +5 ionic charge on the hydrate."}],correct:"water",explanation:"The coefficient after the hydrate dot multiplies all of H₂O: five waters contribute ten H atoms and five additional O atoms. Penta- records that water count."}],summary:["Use the complete state-labelled formula when a common acid name depends on aqueous context.","Learn the common -ate/-ic and -ite/-ous relationships together with established stems and exceptions.","Name the salt first, then the hydrate prefix; a dot coefficient counts whole water molecules."],sources:[{title:"OpenStax Chemistry 2e · Chemical Nomenclature",url:"https://openstax.org/books/chemistry-2e/pages/2-7-chemical-nomenclature"},{title:"OpenStax Chemistry 2e · Ionic and Molecular Compounds",url:"https://openstax.org/books/chemistry-2e/pages/2-6-ionic-and-molecular-compounds"},{title:"OpenStax Chemistry 2e · Chemical Formulas",url:"https://openstax.org/books/chemistry-2e/pages/2-4-chemical-formulas"}]}];function _E({study:a,stage:i,onChange:o,progress:r,zh:d,ionProgress:f,compoundProgress:m,onIons:h,onCompounds:y,onMixed:g,workspace:x="elements"}){const v=[...m1.slice(0,2).map(j=>({id:j.id,label:d?j.labelZh:j.label,title:d?j.zh:j.title,description:d?j.descriptionZh:j.description,stats:Of(r,j.id),selected:x==="elements"&&i===j.id,action:()=>o(j.id)})),...f?[{id:"stage3",label:d?"第三阶段":"Stage 3",title:d?"多原子离子":"Polyatomic Ions",description:d?"名称、公式与电荷，关联记忆。":"Names, formulas and charges. Connected.",stats:Do(f),selected:x==="ions",action:()=>h==null?void 0:h()}]:[],...m?[{id:"stage4",label:d?"第四阶段":"Stage 4",title:d?"化合物命名与化学式书写":"Compound Naming & Formula Writing",description:d?"学会名称与公式，理解背后的规则。":"Names and formulas, with a reason.",stats:Sm(m),selected:x==="compounds",action:()=>y==null?void 0:y()}]:[]],S=Of(r,"mixed"),A=f?Do(f):{total:0,mastered:0};return l.jsxs("section",{className:"stage-section","aria-label":d?"选择学习阶段":"Choose learning stage",children:[l.jsxs("div",{className:"section-heading",children:[l.jsx("h2",{children:d?"你的下一步学习":"Your next chapter"}),l.jsx("span",{className:"subtle",children:d?"随时进入，保留全部进度":"Enter any stage. Keep every memory."})]}),l.jsx("div",{className:"stage-options",children:v.map(j=>l.jsxs("button",{className:`stage-option ${j.id} ${j.selected?"selected-stage":""}`,"aria-pressed":j.selected,onClick:j.action,children:[l.jsxs("div",{className:"stage-option-top",children:[l.jsx("span",{children:j.label}),j.selected?l.jsx(Kt,{size:17}):l.jsx(Ae,{size:15})]}),l.jsx("h3",{children:j.title}),l.jsx("p",{children:j.description}),l.jsxs("div",{className:"stage-mastery",children:[l.jsxs("b",{children:[j.stats.mast
